<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>5月16日陈楚生南村万博轰趴床位选择</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:微软雅黑}
        body{padding:20px;background:#f5f7fa}
        .box{max-width:600px;margin:0 auto;background:white;padding:25px;border-radius:12px}
        h2{text-align:center;margin-bottom:20px}
        .item{padding:10px;background:#f0f4f9;margin:6px 0;border-radius:6px}
        input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:6px}
        button{width:100%;padding:13px;background:#409eff;color:white;border:none;border-radius:6px;margin:6px 0}
        .reset{background:#eee;color:#333}
        .msg{padding:15px;text-align:center;border-radius:6px;margin:10px 0}
        .success{background:#e6f7ff}
        .error{background:#fff2f0}
        .list{margin-top:15px}
        .list-item{padding:8px;background:#f8f9fa;margin:4px 0;border-radius:4px}
    </style>
</head>
<body>
    <div class="box">
        <h2>5月16日陈楚生南村万博轰趴床位选择</h2>
        <div class="item">A房 剩余: <span id="a">3</span></div>
        <div class="item">B房 剩余: <span id="b">2</span></div>
        <div class="item">C房 剩余: <span id="c">2</span></div>
        <div class="item">D房 剩余: <span id="d">4</span></div>

        <input type="text" id="name" placeholder="输入姓名">
        <input type="number" id="num" placeholder="1或2" min=1 max=2>
        <button onclick="go()">分配床位</button>
        <button class="reset" onclick="reset()">重置所有数据</button>
        <div id="msg" class="msg"></div>
        <div id="list"></div>
    </div>

    <script>
        // 免费云端数据库（LeanCloud）
        const APPID = "ik7evvg4ikOJds6b2Ld2YbLN-gzGzoHsz";
        const APPKEY = "jX1wJ0EqnynWSbD7k9jK4qVL";
        const api = "https://ik7evvg4ik.lc-cn-n1.sh.cn/api.leancloud.cn/1.1/classes/bed";

        async function fetchData() {
            let res = await fetch(api, {
                headers: { "X-LC-Id": APPID, "X-LC-Key": APPKEY }
            });
            let data = await res.json();
            return data.results[0] || {
                a:3,b:2,c:2,d:4,
                users:[], records:[]
            };
        }

        async function saveData(obj) {
            let old = await fetchData();
            await fetch(api + "/" + old.objectId, {
                method: "PUT",
                headers: { "X-LC-Id": APPID, "X-LC-Key": APPKEY, "Content-Type": "application/json" },
                body: JSON.stringify(obj)
            });
            refresh();
        }

        async function refresh() {
            let d = await fetchData();
            document.getElementById("a").innerText = d.a;
            document.getElementById("b").innerText = d.b;
            document.getElementById("c").innerText = d.c;
            document.getElementById("d").innerText = d.d;
            let html = "";
            d.records.forEach(r => {
                html += `<div class="list-item">${r.name} → ${r.room}房 ${r.bed}床</div>`;
            });
            document.getElementById("list").innerHTML = html;
        }

        async function go() {
            let name = document.getElementById("name").value.trim();
            let num = parseInt(document.getElementById("num").value);
            let msg = document.getElementById("msg");

            if (!name) { msg.innerText = "请输入姓名"; msg.className = "msg error"; return; }
            if (num !==1 && num !==2) { msg.innerText = "只能1或2"; msg.className = "msg error"; return; }

            let d = await fetchData();
            if (d.users.includes(name)) { msg.innerText = "已经抽过了"; msg.className = "msg error"; return; }

            let can = [];
            if (d.a >= num) can.push("A");
            if (d.b >= num) can.push("B");
            if (d.c >= num) can.push("C");
            if (d.d >= num) can.push("D");
            if (can.length ===0) { msg.innerText="床位不足"; msg.className="msg error"; return; }

            let room = can[Math.floor(Math.random()*can.length)];
            d[room.toLowerCase()] -= num;
            d.users.push(name);
            d.records.push({name, room, bed:num});

            await saveData(d);
            msg.innerText = `成功：${name} → ${room}房`;
            msg.className = "msg success";
            document.getElementById("name").value = "";
            document.getElementById("num").value = "";
        }

        async function reset() {
            await saveData({
                a:3,b:2,c:2,d:4,
                users:[], records:[]
            });
        }

        setInterval(refresh, 2000);
        refresh();
    </script>
</body>
</html>
